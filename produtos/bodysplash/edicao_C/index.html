<style>
/* o fontes.css do kit declara local("Bebas Neue"), que o Chromium não acha; o nome completo resolve */
@font-face{font-family:"Bebas Neue";src:local("Bebas Neue Regular"),local("BebasNeue-Regular")}
:root{--noite:#0B1630;--sol:#FFB547;--luar:#9CC3FF;--creme:#FFF3DE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0B1630}
#root{width:100%;height:100%;position:relative;overflow:hidden;background:#0B1630}
.clip{position:absolute;inset:0}
.cam{position:absolute;inset:0;overflow:visible}
.full{width:100%;height:100%;object-fit:cover}
#camE,#camF{z-index:1}
/* luzes de manhã (canto alto esquerdo) e de noite (canto alto direito) sobre o clipe E */
.luz{z-index:2;mix-blend-mode:screen;opacity:0}
#luzManha{background:radial-gradient(ellipse 70% 45% at 0% 0%,rgba(255,176,70,.75) 0,rgba(255,176,70,.25) 45%,rgba(255,176,70,0) 75%)}
#luzNoite{background:radial-gradient(ellipse 70% 45% at 100% 0%,rgba(110,160,255,.75) 0,rgba(110,160,255,.25) 45%,rgba(110,160,255,0) 75%)}
/* faixa noturna do alto: apoio do título (o texto inventado do clipe E já fica fora do quadro pelo enquadramento) */
.topo{z-index:4;background:linear-gradient(to bottom,rgba(11,22,48,.96) 0,rgba(11,22,48,.86) 150px,rgba(11,22,48,.55) 330px,rgba(11,22,48,0) 470px)}
.flash{z-index:9;background:#FFF3DE}
.bloom{z-index:9;background:radial-gradient(ellipse at 50% 38%,rgba(225,236,255,.9) 0,rgba(156,195,255,.35) 45%,rgba(156,195,255,0) 75%)}
/* apresentação: arte inteira e nítida sobre cópia desfocada; céu que vira de dia para noite */
#bgArt{z-index:0;width:100%;height:100%;object-fit:cover}
.ceu{z-index:1;opacity:0}
#ceuDia{background:linear-gradient(to bottom,rgba(255,168,60,.62) 0,rgba(255,196,120,.22) 16%,rgba(255,196,120,0) 30%,rgba(255,196,120,0) 72%,rgba(255,168,60,.32) 100%)}
#ceuNoite{background:linear-gradient(to bottom,rgba(6,14,40,.9) 0,rgba(20,44,120,.4) 16%,rgba(20,44,120,0) 30%,rgba(20,44,120,0) 72%,rgba(6,14,40,.75) 100%)}
#ceuMix{background:linear-gradient(90deg,rgba(255,168,60,.42) 0,rgba(255,168,60,0) 48%,rgba(60,100,220,0) 52%,rgba(60,100,220,.5) 100%)}
.est{position:absolute;display:block;width:6px;height:6px;border-radius:50%;background:#EAF2FF;box-shadow:0 0 10px 2px rgba(200,220,255,.8)}
#artBox{position:absolute;inset:auto;left:40px;top:345px;width:1000px;height:1037px;z-index:2}
#arte{width:1000px;height:1037px;border-radius:6px;box-shadow:0 30px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,243,222,.08)}
.dim{inset:auto;top:0;height:1037px;opacity:0}
#dimDia{left:620px;width:380px;background:linear-gradient(90deg,rgba(4,9,24,0) 0,rgba(4,9,24,.5) 24px)}
#dimNoite{left:0;width:630px;background:linear-gradient(270deg,rgba(4,9,24,0) 0,rgba(4,9,24,.5) 24px)}
.luzA{inset:auto;mix-blend-mode:screen;opacity:0}
#luzDia{left:90px;top:-60px;width:580px;height:560px;background:radial-gradient(ellipse 50% 42% at 50% 24%,rgba(255,186,90,.6) 0,rgba(255,186,90,.18) 55%,rgba(255,186,90,0) 80%)}
#luzLua{left:590px;top:-60px;width:310px;height:560px;background:radial-gradient(ellipse 52% 42% at 50% 24%,rgba(120,170,255,.65) 0,rgba(120,170,255,.2) 55%,rgba(120,170,255,0) 80%)}
#varre{overflow:hidden;mix-blend-mode:screen;border-radius:6px}
#varre i{position:absolute;top:0;left:0;width:100%;height:100%;display:block;
  background:linear-gradient(105deg,rgba(255,236,200,0) 38%,rgba(255,236,200,.36) 48%,rgba(190,215,255,.36) 52%,rgba(190,215,255,0) 62%)}
/* rótulos DIA / NOITE acima das tampas, com colchete */
.rot{inset:auto;top:-152px;height:176px;z-index:6;display:flex;flex-direction:column;align-items:center}
#rotDia{left:146px;width:464px}
#rotNoite{left:639px;width:215px}
.rotTx{display:flex;align-items:center;gap:14px;white-space:nowrap;font-family:"Bebas Neue";font-size:96px;line-height:1;
  text-shadow:0 0 30px rgba(0,0,0,.6),0 4px 18px rgba(0,0,0,.7)}
#rotDia .rotTx{color:var(--sol)}
#rotNoite .rotTx{color:var(--luar)}
.rotTx .ico{width:66px;height:66px}
.colch{display:block;margin-top:14px;width:100%;height:46px;overflow:visible}
/* títulos: Bebas Neue, sobem por trás de uma linha (máscara) */
.titulo{z-index:6;height:auto;bottom:auto;display:flex;flex-direction:column;align-items:center}
.mk{display:block;overflow:hidden;padding:0 10px}
.mk>span,.mk0>span{display:block;white-space:nowrap}
.mk0{display:block;padding:0 10px}
.tt{font-family:"Bebas Neue";color:var(--creme);line-height:.95;text-align:center;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.tt b{font-weight:400}
.tt .sol{color:var(--sol)}
.tt .luar{color:var(--luar)}
.sub{font-family:"Poppins";font-weight:600;font-size:46px;color:var(--creme);letter-spacing:1px;text-shadow:0 3px 14px rgba(0,0,0,.7)}
.icones{display:flex;align-items:center;gap:0;margin-top:14px}
.icones .ico{width:70px;height:70px}
.traco{display:block;width:250px;height:4px;margin:0 18px;border-radius:2px;background:linear-gradient(90deg,var(--sol),var(--luar));transform-origin:left center}
/* legenda caixa-palavra: cada palavra numa etiqueta noturna; palavra-chave em âmbar (dia), azul-luar (noite) ou creme */
.legenda{z-index:7;height:auto;bottom:auto}
.linha{display:flex;justify-content:center;align-items:center;gap:12px;padding:0 150px 0 0}
.cx{display:inline-block;font-family:"Poppins";font-weight:800;font-size:62px;line-height:1.12;color:var(--creme);
  background:rgba(11,22,48,.9);padding:4px 20px 2px;border-radius:16px;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.cx.k-d{background:var(--sol);color:#2A1700}
.cx.k-n{background:var(--luar);color:#08122A}
.cx.k-c{background:var(--creme);color:#0B1630}
/* CTA */
#vinF{z-index:2;background:radial-gradient(ellipse 75% 60% at 50% 45%,rgba(11,22,48,0) 52%,rgba(11,22,48,.55) 100%)}
#cta{z-index:8}
#cta-b{position:absolute;left:48px;top:1418px;display:flex;align-items:center;gap:16px;padding:12px 34px 14px 14px;border-radius:28px;
  background:linear-gradient(100deg,#FFB547 0,#FFD79A 42%,#C9DCFF 70%,#9CC3FF 100%);
  box-shadow:0 0 50px rgba(156,195,255,.45),0 10px 26px rgba(0,0,0,.45)}
#cta-b svg{display:block;width:66px;height:66px;flex:none}
.bt{display:flex;flex-direction:column}
.bt1{display:block;font-family:"Poppins";font-weight:800;font-size:42px;line-height:1.1;color:#0B1630;white-space:nowrap}
.bt2{display:block;font-family:"Poppins";font-weight:600;font-size:28px;line-height:1.2;color:#0B1630;white-space:nowrap}
#onda{position:absolute;left:36px;top:1480px;width:120px;height:120px;display:block;border:5px solid var(--luar);border-radius:50%}
#seta{position:absolute;left:40px;top:1540px;width:70px;height:56px;display:block}
</style>
