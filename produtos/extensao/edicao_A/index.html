.clip{position:absolute;inset:0}

.titulo{display:flex;justify-content:center;align-items:flex-start;padding-top:250px;z-index:6}
.titulo span{font-family:"Bebas Neue";color:var(--texto);font-size:190px;line-height:.9;text-align:center;letter-spacing:2px;

.titulo b{color:var(--destaque);font-weight:400}
.legenda{height:auto;bottom:auto;display:flex;justify-content:center;gap:14px;z-index:7;padding:0 120px 0 60px;flex-wrap:wrap}
.pal{font-family:"Inter";font-weight:800;font-size:74px;color:var(--texto);background:var(--base);padding:6px 20px;border-radius:14px;

#congela{z-index:2}
#congela img{position:absolute;inset:0;width:1080px;height:1920px}
.etq{position:absolute;font-family:"Bebas Neue";font-size:84px;color:var(--destaque);background:var(--base);padding:6px 22px;border-radius:12px;
  box-shadow:0 0 30px rgba(61,245,167,.35)}
.linha{position:absolute;height:6px;background:var(--destaque);border-radius:3px;transform-origin:left center;box-shadow:0 0 14px var(--destaque)}
.anel{position:absolute;border:10px solid var(--destaque);border-radius:50%;box-shadow:0 0 40px var(--destaque),inset 0 0 30px rgba(61,245,167,.4)}
.lista{display:flex;justify-content:center;align-items:flex-start;gap:18px;padding-top:270px;z-index:6}
.lista span{font-family:"Bebas Neue";font-size:120px;color:var(--texto);background:var(--base);padding:4px 26px;border-radius:14px}
.lista span.ok{color:var(--base);background:var(--destaque)}
#cta{z-index:8}
#cta .bot{position:absolute;left:60px;top:1330px;font-family:"Bebas Neue";font-size:104px;color:var(--base);background:var(--destaque);
  padding:10px 34px;border-radius:20px;box-shadow:0 0 50px rgba(61,245,167,.6)}
#cta .seta{position:absolute;left:150px;top:1450px;font-size:96px;font-family:"Noto Color Emoji"}
