<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 436" width="1150" height="436" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Como um vídeo é feito</title>
<desc id="d">Três etapas. Roteiro: anúncio, agente de roteiro, aprovação e revisor do texto. Clipes: primeiro quadro no Flow, clipe no Veo, conferência e aprovação. Edição e postagem: narração, edição HyperFrames, render, revisor do vídeo e postagem manual. A memória do projeto recebe violações e métricas da postagem e é lida pelo agente de roteiro.</desc>
