<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/fontes.css">
<link rel="stylesheet" href="assets/tokens.css">
<script src="assets/gsap.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:var(--fundo);}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--fundo);font-family:var(--corpo);color:var(--texto);}
  #fundo{position:absolute;inset:0;background:var(--fundo);}
  #vinheta{position:absolute;inset:0;background:radial-gradient(ellipse 75% 75% at 50% 50%,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 100%);}
  #grao{position:absolute;inset:-400px;background-image:url(assets/grao.png);background-size:384px 384px;opacity:.04;mix-blend-mode:screen;}
  #palco{position:absolute;inset:0;transform-origin:960px 540px;perspective:1600px;}

  /* ponto que vem da cena 01 e vira a seta */
  #ponto{position:absolute;left:951px;top:531px;width:18px;height:18px;border-radius:50%;background:var(--destaque);
         box-shadow:0 0 18px 6px rgba(198,244,50,.6),0 0 60px 18px rgba(198,244,50,.25);}
  #seta{position:absolute;left:760px;top:537px;width:400px;height:6px;opacity:0;}
  #seta .linha{position:absolute;left:0;top:0;width:100%;height:6px;border-radius:3px;background:var(--destaque);transform-origin:50% 50%;
               box-shadow:0 0 16px rgba(198,244,50,.45);}
  #seta .ponta{position:absolute;right:-6px;top:-13px;width:0;height:0;border-left:26px solid var(--destaque);border-top:16px solid transparent;border-bottom:16px solid transparent;opacity:0;}

  /* cartão de anúncio */
  #cartao{position:absolute;left:410px;top:274px;width:300px;height:533px;border-radius:28px;background:var(--cartao);
          box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;opacity:0;}
  #cartao .rot{position:absolute;left:22px;top:22px;font:600 22px/1 var(--corpo);color:var(--cartao-texto);background:#ECEBE6;border-radius:999px;padding:8px 16px;}
  #cartao .img{position:absolute;left:22px;top:72px;width:256px;height:236px;border-radius:18px;background:#E3E2DD;overflow:hidden;}
  #cartao .img::after{content:"";position:absolute;left:78px;top:48px;width:100px;height:140px;border-radius:22px 22px 14px 14px;background:#D2D1CB;}
  #cartao .l{position:absolute;left:22px;height:16px;border-radius:8px;background:#DAD9D3;}
  #cartao .btn{position:absolute;left:22px;bottom:24px;width:256px;height:52px;border-radius:14px;background:#C9C8C2;}
  #cartao .brilho{position:absolute;top:0;left:-200px;width:160px;height:100%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.75),rgba(255,255,255,0));}

  /* moldura de celular (destaque 420x747) */
  #cel{position:absolute;left:1030px;top:166px;width:420px;height:747px;opacity:0;}
  #cel .tela{position:absolute;inset:0;border-radius:36px;border:6px solid var(--moldura);box-sizing:border-box;overflow:hidden;background:#000;
             box-shadow:0 30px 80px rgba(0,0,0,.55);}
  #video-bs{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;}
  #selo{position:absolute;left:50%;top:722px;transform:translateX(-50%);white-space:nowrap;}
  #selo .p{display:flex;align-items:center;gap:12px;font:600 26px/1 var(--corpo);color:var(--texto);background:#1A1A1E;border:1px solid rgba(255,255,255,.14);
           border-radius:999px;padding:12px 22px;opacity:0;box-shadow:0 12px 30px rgba(0,0,0,.5);}
  #selo .d{width:12px;height:12px;border-radius:50%;background:var(--destaque);}

  /* título anúncio -> vídeo */
  #titulo{position:absolute;left:120px;top:0;height:1080px;display:flex;flex-direction:column;justify-content:center;}
  .tt{font-family:var(--titulo);font-weight:800;font-size:128px;line-height:.95;letter-spacing:-0.02em;opacity:0;}
  #tt1{color:var(--texto-2);}
  #tt2{color:var(--texto);} #tt2 b{color:var(--destaque);font-weight:800;}

  /* linha do tempo */
  #linha{position:absolute;left:140px;top:0;width:1020px;height:1080px;}
  #mes{position:absolute;left:0;top:330px;font-family:var(--titulo);font-weight:800;font-size:140px;line-height:.95;letter-spacing:-0.02em;color:var(--texto);opacity:0;}
  #mes b{color:var(--destaque);font-weight:800;}
  #trilho{position:absolute;left:0;top:598px;width:1020px;height:4px;border-radius:2px;background:rgba(255,255,255,.16);transform-origin:0 50%;}
  #enche{position:absolute;left:0;top:596px;width:1020px;height:8px;border-radius:4px;background:var(--destaque);transform-origin:0 50%;box-shadow:0 0 18px rgba(198,244,50,.4);}
  #cabeca{position:absolute;left:-11px;top:589px;width:22px;height:22px;border-radius:50%;background:var(--destaque);box-shadow:0 0 0 6px rgba(198,244,50,.18);opacity:0;}
  .tick{position:absolute;top:620px;width:3px;height:16px;border-radius:2px;background:rgba(255,255,255,.22);}
  .data{position:absolute;top:660px;font:500 40px/1 var(--corpo);color:var(--texto);opacity:0;font-variant-numeric:tabular-nums;}
  #d1{left:0;} #d2{right:0;text-align:right;}
  #carimbo{position:absolute;left:520px;top:560px;opacity:0;}
  #carimbo .c{font:700 46px/1 var(--corpo);letter-spacing:.06em;text-transform:uppercase;color:var(--destaque);background:var(--fundo);
              border:5px solid var(--destaque);border-radius:14px;padding:14px 26px;white-space:nowrap;box-shadow:0 0 30px rgba(198,244,50,.25);}

  /* R$ 0 de API */
  #custo{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #trava{display:flex;align-items:center;font-family:var(--titulo);font-weight:800;font-size:236px;line-height:1;letter-spacing:-0.02em;color:var(--texto);
         font-variant-numeric:tabular-nums;}
  #rs,#api{opacity:0;}
  #slot{position:relative;height:1.1em;width:.66em;overflow:hidden;margin:0 .22em 0 .2em;opacity:0;}
  #rolo{position:absolute;left:0;top:0;width:100%;}
  #rolo span{display:block;height:1.1em;line-height:1.1em;text-align:center;}
  #sub{font:500 46px/1.2 var(--corpo);color:var(--texto-2);margin-top:26px;opacity:0;}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8.2" data-width="1920" data-height="1080" data-fps="30">
  <div id="fundo"></div>
  <div id="vinheta"></div>
  <div id="palco">
    <div id="seta"><div class="linha"></div><div class="ponta"></div></div>
    <div id="ponto"></div>

    <div id="cartao">
      <div class="img"></div>
      <div class="rot">anúncio</div>
      <div class="l" style="top:334px;width:236px"></div>
      <div class="l" style="top:362px;width:180px"></div>
      <div class="l" style="top:404px;width:120px;height:22px;background:#CFCEC8"></div>
      <div class="btn"></div>
      <div class="brilho"></div>
    </div>

    <div id="titulo" data-layout-allow-overlap>
      <div class="tt" id="tt1">anúncio</div>
      <div class="tt" id="tt2">→ <b>vídeo</b></div>
    </div>

    <div id="cel">
      <div class="tela">
        <video id="video-bs" class="clip" data-start="2.55" data-duration="3.95" data-media-start="3.3" data-track-index="2" muted playsinline src="assets/midia/bodysplash_D.mp4"></video>
      </div>
      <div id="selo"><div class="p"><span class="d"></span>TikTok Shop · afiliado</div></div>
    </div>

    <div id="linha">
      <div id="mes">um <b>mês</b></div>
      <div id="trilho"></div>
      <div id="ticks"></div>
      <div id="enche"></div>
      <div id="cabeca"></div>
      <div class="data" id="d1">05/10</div>
      <div class="data" id="d2">04/11/2026</div>
      <div id="carimbo" data-layout-allow-occlusion><div class="c">conta real</div></div>
    </div>

    <div id="custo">
      <div id="trava">
        <span id="rs">R$</span>
        <span id="slot"><span id="rolo"><span>9</span><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span><span>0</span></span></span>
        <span id="api">de API</span>
      </div>
      <div id="sub">só a assinatura do Google AI Plus</div>
    </div>
  </div>
  <div id="grao" data-layout-ignore></div>

  <audio id="fala" class="clip" data-start="0.25" data-track-index="10" data-volume="1" src="assets/fala.mp3"></audio>
  <audio id="sfx-whoosh1" class="clip" data-start="1.3" data-track-index="11" data-volume="0.28" src="assets/sfx/whoosh_curto.wav"></audio>
  <audio id="sfx-pop" class="clip" data-start="2.68" data-track-index="12" data-volume="0.3" src="assets/sfx/pop.wav"></audio>
  <audio id="sfx-subida" class="clip" data-start="4.05" data-track-index="13" data-volume="0.28" src="assets/sfx/subida.wav"></audio>
  <audio id="sfx-clique" class="clip" data-start="5.24" data-track-index="14" data-volume="0.32" src="assets/sfx/clique.wav"></audio>
  <audio id="sfx-tique" class="clip" data-start="6.13" data-track-index="15" data-volume="0.3" src="assets/sfx/tique.wav"></audio>
  <audio id="sfx-batida" class="clip" data-start="7.31" data-track-index="16" data-volume="0.32" src="assets/sfx/batida.wav"></audio>
  <audio id="sfx-whoosh2" class="clip" data-start="7.8" data-track-index="17" data-volume="0.28" src="assets/sfx/whoosh_curto.wav"></audio>
</div>
<script>
(function(){
  // tempos na cena = 0,25 + inicio (fala.json)
  const W = {sistema:0.416, transforma:0.923, anuncios:1.406, produtos:1.984, videos:2.704, afiliado:3.175,
             rodou:4.096, mes:4.615, verdade:5.252, custo:6.146, api:6.594, zero:7.337, fim:8.2};

  // marcas dos 31 dias (05/10 a 04/11)
  const ticks = document.getElementById('ticks');
  for (let i = 0; i < 31; i++) {
    const t = document.createElement('div');
    t.className = 'tick'; t.dataset.i = i;
    t.style.left = (i * 1020 / 30 - 1.5) + 'px';
    ticks.appendChild(t);
  }

  const tl = gsap.timeline({paused:true});
  let s = 777;
  const rnd = () => (s = (s * 1103515245 + 12345) % 2147483648) / 2147483648;
  for (let t = 0; t < 8.2; t += 1/15) tl.set('#grao', {x: Math.round(rnd()*380), y: Math.round(rnd()*380)}, t);

  // respiro de câmera
  tl.fromTo('#palco', {scale:1}, {scale:1.03, duration:8.2, ease:'none'}, 0);

  // "Um sistema transforma": o ponto vira a seta
  tl.fromTo('#ponto', {scale:1}, {scale:1.5, duration:0.18, ease:'power2.out'}, 0.12);
  tl.to('#ponto', {scale:0.34, duration:0.16, ease:'power2.in'}, 0.30);
  tl.set('#seta', {opacity:1}, W.sistema);
  tl.fromTo('#seta .linha', {scaleX:0.015}, {scaleX:1, duration:0.6, ease:'expo.out'}, W.sistema);
  tl.to('#ponto', {opacity:0, duration:0.08, ease:'none'}, W.sistema + 0.04);
  tl.fromTo('#seta .ponta', {opacity:0, x:-30}, {opacity:1, x:0, duration:0.35, ease:'back.out(1.4)'}, W.transforma - 0.05);

  // "anúncios": cartão entra pela esquerda
  tl.fromTo('#cartao', {x:-520, opacity:0, rotation:-4}, {x:0, opacity:1, rotation:0, duration:0.6, ease:'back.out(1.4)'}, W.anuncios - 0.08);
  tl.fromTo('#cartao .brilho', {x:0}, {x:720, duration:0.9, ease:'power1.inOut'}, W.produtos - 0.2);

  // "vídeos": o cartão dobra, cruza a seta e vira a moldura de celular
  const F = W.videos - 0.16;
  tl.to('#cartao', {rotationY:90, x:300, scale:1.08, duration:0.18, ease:'power2.in'}, F);
  tl.to('#seta', {opacity:0, scaleX:0.2, transformOrigin:'100% 50%', duration:0.18, ease:'power2.in'}, F);
  tl.set('#cartao', {opacity:0}, F + 0.18);
  tl.set('#cel', {opacity:1}, F + 0.18);
  tl.fromTo('#cel', {rotationY:-90, x:-330, scale:0.75}, {rotationY:0, x:0, scale:1, duration:0.55, ease:'back.out(1.4)', immediateRender:false}, F + 0.18);
  tl.fromTo('#tt1', {opacity:0, y:50}, {opacity:1, y:0, duration:0.5, ease:'back.out(1.4)'}, W.videos + 0.08);
  tl.fromTo('#tt2', {opacity:0, y:50}, {opacity:1, y:0, duration:0.5, ease:'back.out(1.4)'}, W.videos + 0.18);

  // "afiliado": selo encaixa no pé da moldura
  tl.fromTo('#selo .p', {opacity:0, y:40, scale:0.9}, {opacity:1, y:0, scale:1, duration:0.45, ease:'back.out(1.6)'}, W.afiliado - 0.05);

  // "Rodou": título sai, moldura desliza para a direita, linha do tempo corre
  tl.to(['#tt1','#tt2'], {opacity:0, y:-50, duration:0.28, ease:'power2.in', stagger:0.04}, W.rodou - 0.2);
  tl.to('#cel', {x:420, scale:0.82, duration:0.6, ease:'power3.inOut'}, W.rodou - 0.12);
  tl.fromTo('#trilho', {scaleX:0}, {scaleX:1, duration:0.4, ease:'power3.out'}, W.rodou - 0.05);
  tl.fromTo('.tick', {opacity:0, y:12}, {opacity:1, y:0, duration:0.25, ease:'power2.out', stagger:0.008}, W.rodou);
  tl.fromTo('#d1', {opacity:0, y:30}, {opacity:1, y:0, duration:0.45, ease:'back.out(1.4)'}, W.rodou);
  tl.fromTo('#d2', {opacity:0, y:30}, {opacity:1, y:0, duration:0.45, ease:'back.out(1.4)'}, W.rodou + 0.1);
  const FILL0 = W.rodou + 0.05, FILL = 0.92;
  tl.fromTo('#enche', {scaleX:0}, {scaleX:1, duration:FILL, ease:'power1.inOut'}, FILL0);
  tl.set('#cabeca', {opacity:1}, FILL0);
  tl.fromTo('#cabeca', {x:0}, {x:1020, duration:FILL, ease:'power1.inOut', immediateRender:false}, FILL0);
  const fe = gsap.parseEase('power1.inOut');
  document.querySelectorAll('.tick').forEach(el => {
    const f = (+el.dataset.i) / 30;
    // instante em que o preenchimento passa pela marca (inverso da curva, por busca)
    let lo = 0, hi = 1;
    for (let k = 0; k < 20; k++) { const m = (lo + hi) / 2; if (fe(m) < f) lo = m; else hi = m; }
    tl.to(el, {backgroundColor:'#C6F432', duration:0.06, ease:'none'}, FILL0 + lo * FILL);
  });
  tl.fromTo('#mes', {opacity:0, y:50}, {opacity:1, y:0, duration:0.5, ease:'back.out(1.4)'}, W.mes - 0.15);

  // "verdade": carimbo pousa sobre a linha
  tl.fromTo('#carimbo', {opacity:0, scale:1.9, rotation:-14}, {opacity:1, scale:1, rotation:-7, duration:0.24, ease:'power4.out'}, W.verdade - 0.02);
  tl.fromTo('#linha', {y:0}, {y:6, duration:0.05, ease:'power1.out', yoyo:true, repeat:1}, W.verdade + 0.2);

  // "Custo": tudo sai por cima; entra R$
  const C = W.custo - 0.24;
  tl.to('#linha', {y:-90, opacity:0, duration:0.26, ease:'power2.in'}, C);
  tl.to('#cel', {y:-120, opacity:0, duration:0.26, ease:'power2.in'}, C + 0.04);
  tl.fromTo('#rs', {opacity:0, y:60, scale:0.92}, {opacity:1, y:0, scale:1, duration:0.5, ease:'back.out(1.4)'}, W.custo + 0.04);
  tl.fromTo('#slot', {opacity:0, y:60}, {opacity:1, y:0, duration:0.5, ease:'back.out(1.4)'}, W.custo + 0.12);
  tl.fromTo('#api', {opacity:0, y:60, scale:0.92}, {opacity:1, y:0, scale:1, duration:0.5, ease:'back.out(1.4)'}, W.api - 0.04);
  // "zero": o número rola de 9 até 0 e trava
  // rola como caça-níquel (~0,11 s por algarismo) e trava no 0 exatamente em "zero"
  const R0 = W.custo + 0.2;
  tl.fromTo('#rolo', {yPercent:0}, {yPercent:-90, duration:W.zero - R0, ease:'power1.inOut'}, R0);
  tl.fromTo('#rolo', {filter:'blur(0px)'}, {filter:'blur(5px)', duration:0.2, ease:'power1.out'}, R0);
  tl.to('#rolo', {filter:'blur(0px)', duration:0.14, ease:'power2.out'}, W.zero - 0.14);
  tl.set(['#rs','#rolo','#api'], {color:'#C6F432'}, W.zero);
  tl.fromTo('#trava', {scale:1.07}, {scale:1, duration:0.35, ease:'back.out(2)'}, W.zero);
  tl.fromTo('#sub', {opacity:0, y:30}, {opacity:1, y:0, duration:0.4, ease:'back.out(1.4)'}, W.zero + 0.08);
  tl.to('#trava', {scale:1.015, duration:0.45, ease:'sine.inOut'}, W.zero + 0.36);

  // saída: varrido para a esquerda
  tl.to('#custo', {x:-1300, opacity:0, duration:0.24, ease:'power3.in'}, 7.84);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
})();
</script>
</body>
</html>
